name: Full acceptance

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

jobs:
  full-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24.x"
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Ingest and gate the complete 50,000-event fixture
        run: HYRUM_RUN_K6=1 pnpm demo:acceptance
      - name: Verify acceptance report
        run: |
          jq -e '
            .status == "passed" and
            .phases.fixture.record_count == 50000 and
            .phases.capture_to_ledger.accepted_count == 50000 and
            .phases.capture_to_ledger.rejected_count == 0 and
            .phases.differential_replay.gate_outcome == "block" and
            .phases.differential_replay.signature_verified_by_control_plane == true and
            .phases.load.executed_against_live_control_plane == true and
            .phases.load.thresholds_passed == true
          ' tmp/demo-acceptance-report.json
