pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css}"
      run: pnpm exec biome check --no-errors-on-unmatched {staged_files}
    prettier:
      glob: "*.{md,yml,yaml}"
      run: pnpm exec prettier --check {staged_files}

pre-push:
  commands:
    verify:
      run: pnpm verify
